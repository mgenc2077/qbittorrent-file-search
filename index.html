<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>qBittorrent File Search</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-body: #0f172a;
            --bg-card: #1e293b;
            --bg-input: #334155;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --border: #334155;
            --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-body);
            color: var(--text-main);
            min-height: 100vh;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 900px;
        }

        header {
            text-align: center;
            margin-bottom: 3rem;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            background: linear-gradient(to right, #60a5fa, #a855f7);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 1.1rem;
        }

        .search-container {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
            position: relative;
        }

        input[type="text"] {
            flex: 1;
            background-color: var(--bg-card);
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 1rem 1.5rem;
            border-radius: 0.75rem;
            font-size: 1.1rem;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
            box-shadow: var(--shadow);
        }

        input[type="text"]:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
        }

        button {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 0 2rem;
            border-radius: 0.75rem;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
            box-shadow: var(--shadow);
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        button:active {
            transform: translateY(1px);
        }

        .results-container {
            background-color: var(--bg-card);
            border-radius: 1rem;
            overflow: hidden;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            display: none;
            /* Hidden by default */
        }

        .results-container.visible {
            display: block;
            animation: fadeIn 0.3s ease-out;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th {
            background-color: #1e293b;
            color: var(--text-muted);
            font-weight: 600;
            padding: 1rem 1.5rem;
            border-bottom: 1px solid var(--border);
            text-transform: uppercase;
            font-size: 0.75rem;
            letter-spacing: 0.05em;
        }

        td {
            padding: 1rem 1.5rem;
            border-bottom: 1px solid var(--border);
            color: var(--text-main);
        }

        tr:last-child td {
            border-bottom: none;
        }

        tbody tr:hover {
            background-color: rgba(255, 255, 255, 0.03);
        }

        .hash-cell {
            font-family: 'SF Mono', 'Roboto Mono', monospace;
            font-size: 0.9rem;
            color: var(--primary);
            cursor: pointer;
            position: relative;
        }

        .hash-cell:hover {
            text-decoration: underline;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 2rem;
            color: var(--text-muted);
        }

        .loading.active {
            display: block;
        }

        .spinner {
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            border-top: 3px solid var(--primary);
            width: 24px;
            height: 24px;
            animation: spin 1s linear infinite;
            margin: 0 auto 0.5rem;
        }

        .toast {
            position: fixed;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background-color: #10b981;
            color: white;
            padding: 0.75rem 1.5rem;
            border-radius: 2rem;
            font-weight: 500;
            box-shadow: var(--shadow);
            opacity: 0;
            transition: transform 0.3s, opacity 0.3s;
            z-index: 100;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        .action-btn {
            padding: 0.5rem 1rem;
            font-size: 0.9rem;
            min-width: 100px;
        }

        .progress-wrapper {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .progress-track {
            flex: 1;
            height: 6px;
            background-color: var(--bg-input);
            border-radius: 3px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background-color: var(--primary);
        }

        .progress-text {
            font-size: 0.8rem;
            color: var(--text-muted);
            min-width: 3rem;
            text-align: right;
            font-variant-numeric: tabular-nums;
        }

        /* Responsive */
        @media (max-width: 600px) {
            body {
                padding: 1rem;
            }

            h1 {
                font-size: 1.75rem;
            }

            .search-container {
                flex-direction: column;
            }

            button {
                width: 100%;
                padding: 1rem;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <header>
            <h1>qFileSearch</h1>
            <p class="subtitle">Instantly search through your qBittorrent library</p>
        </header>

        <div class="search-container">
            <input type="text" id="search" placeholder="Search for files..." autofocus>
            <button onclick="search()">Search</button>
        </div>

        <div id="loading" class="loading">
            <div class="spinner"></div>
            <p>Searching...</p>
        </div>

        <div class="results-container" id="results-container">
            <table>
                <thead>
                    <tr>
                        <th style="width: 120px;">Hash</th>
                        <th>Name</th>
                        <th style="width: 200px;">Progress</th>
                        <th style="width: 140px;">Status</th>
                    </tr>
                </thead>
                <tbody id="results">
                </tbody>
            </table>
        </div>
    </div>

    <div id="toast" class="toast">Hash copied to clipboard!</div>

    <script>
        const searchInput = document.getElementById('search');

        searchInput.addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                search();
            }
        });

        function search() {
            const query = searchInput.value.trim();
            if (!query) return;

            const loading = document.getElementById('loading');
            const resultsContainer = document.getElementById('results-container');
            const resultsBody = document.getElementById('results');

            // Reset UI
            resultsContainer.classList.remove('visible');
            resultsBody.innerHTML = '';
            loading.classList.add('active');

            fetch(`/search?query=${encodeURIComponent(query)}`)
                .then(response => {
                    if (!response.ok) throw new Error('Network response was not ok');
                    return response.json();
                })
                .then(data => {
                    loading.classList.remove('active');

                    if (data && data.length > 0) {
                        data.forEach(file => {
                            const row = document.createElement('tr');
                            // Truncate hash for display but keep full for copy
                            const shortHash = file.hash.substring(0, 8) + '...';

                            const hashTd = document.createElement('td');
                            hashTd.className = 'hash-cell';
                            hashTd.onclick = () => copyToClipboard(file.hash);
                            hashTd.title = `Click to copy full hash: ${file.hash}`;
                            hashTd.innerText = shortHash;

                            const nameTd = document.createElement('td');
                            nameTd.innerText = file.name;

                            const progressTd = document.createElement('td');
                            const percent = Math.round((file.progress || 0) * 100);
                            progressTd.innerHTML = `
                                <div class="progress-wrapper">
                                    <div class="progress-track">
                                        <div class="progress-fill" style="width: ${percent}%"></div>
                                    </div>
                                    <span class="progress-text">${percent}%</span>
                                </div>
                            `;

                            const actionTd = document.createElement('td');
                            const btn = document.createElement('button');
                            btn.className = 'action-btn';
                            btn.innerText = file.status;
                            btn.onclick = function () {
                                enableFile(file.name, btn);
                            };
                            actionTd.appendChild(btn);

                            row.appendChild(hashTd);
                            row.appendChild(nameTd);
                            row.appendChild(progressTd);
                            row.appendChild(actionTd);

                            resultsBody.appendChild(row);
                        });
                        resultsContainer.classList.add('visible');
                    } else {
                        // Optionally show a "no results" message
                        resultsBody.innerHTML = '<tr><td colspan="4" style="text-align:center; padding: 2rem; color: var(--text-muted);">No files found matching your query.</td></tr>';
                        resultsContainer.classList.add('visible');
                    }
                })
                .catch(error => {
                    console.error('Error:', error);
                    loading.classList.remove('active');
                    resultsBody.innerHTML = '<tr><td colspan="4" style="text-align:center; color: #ef4444; padding: 1rem;">An error occurred while searching.</td></tr>';
                    resultsContainer.classList.add('visible');
                });
        }

        function enableFile(name, btn) {
            btn.disabled = true;
            fetch(`/enable?name=${encodeURIComponent(name)}`, { method: 'POST' })
                .then(response => {
                    if (response.ok) {
                        btn.innerText = 'downloading';
                    } else {
                        btn.disabled = false;
                        alert('Failed to enable file');
                    }
                })
                .catch(error => {
                    console.error('Error:', error);
                    btn.disabled = false;
                    alert('Error enabling file');
                });
        }

        function copyToClipboard(text) {
            navigator.clipboard.writeText(text).then(() => {
                showToast();
            });
        }

        function showToast() {
            const toast = document.getElementById('toast');
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }
    </script>
</body>

</html>
